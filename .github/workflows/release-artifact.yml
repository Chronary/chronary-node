name: Release Artifact

# Publishes @chronary/sdk to npm and creates a GitHub Release.
#
# Provenance posture:
#   - Publishes via npm OIDC Trusted Publishing — no NPM_TOKEN required.
#     The `id-token: write` permission and `registry-url` on setup-node
#     are sufficient once chronary-node is registered as a Trusted
#     Publisher for @chronary/sdk on npmjs.com.
#   - npm CLI >= 11.5.1 is required for OIDC trusted publishing; we
#     pin npm to latest before publishing because Node 22 ships with
#     npm 10.x by default.
#   - `npm publish --provenance` records a Sigstore attestation that
#     links the published tarball back to this workflow run.
#   - GitHub artifact attestations also fire on public repos via
#     actions/attest-build-provenance.
#
# Prerequisites (one-time, on flip to public):
#   1. chronary-node is public on GitHub.
#   2. npmjs.com → @chronary org → Trusted Publishers → register
#      repo `Chronary/chronary-node`, workflow `release-artifact.yml`,
#      environment blank.
#   3. NPM_TOKEN repo secret has been deleted and the legacy
#      `chronary-node-release` npm access token revoked.

on:
  push:
    tags:
      - 'v*'

# Least privilege (#1599): read-only by default; the release job raises
# only the scopes its steps use.
permissions:
  contents: read

jobs:
  release:
    # contents: write for `gh release create`; id-token + attestations for
    # OIDC registry publishing and actions/attest-build-provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing pushes with the checkout token, so keep it out of
          # .git/config, where install and test scripts could read it (#1659).
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: |
          # npm install -g npm@latest fails when the runner's bundled npm is incomplete
          # (e.g. missing promise-retry on Node 22.22+). Bypass by downloading the
          # tarball directly into the existing module directory.
          NPM_DIR="$(node -e "process.stdout.write(require('path').resolve(process.execPath,'../../lib/node_modules/npm'))")"
          curl -fsSL https://registry.npmjs.org/npm/-/npm-11.5.1.tgz -o /tmp/npm.tgz
          tar -xzf /tmp/npm.tgz --strip-components=1 -C "$NPM_DIR"
          npm --version

      - name: Validate release manifest
        id: manifest
        run: |
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('.chronary-release.json','utf8')); if (manifest.artifact !== 'ts-sdk') throw new Error('Expected artifact ts-sdk'); if (manifest.public_tag !== process.env.GITHUB_REF_NAME) throw new Error('Tag mismatch between manifest and workflow ref'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'publish_registry=' + String(Boolean(manifest.publish_registry)) + '\n');"
          test -f RELEASE_NOTES.txt

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate package contents
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack

      # SBOM (EU CRA Annex I Part II (1), #1634): CycloneDX, attached to the
      # GitHub Release. Fail-closed: these run before anything is published,
      # with no continue-on-error, so no release ships without a valid SBOM.
      # Tool pins and the validator live in scripts/public-release/sbom.mjs.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          # Resolve the runtime dependency tree a user gets from the registry,
          # in a clean directory (no workspace node_modules, no install scripts).
          work="$RUNNER_TEMP/sbom-src"
          rm -rf "$work" && mkdir -p "$work" sbom
          cp package.json "$work/"
          (cd "$work" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          SBOM_FILE="sbom/chronary-sdk-${GITHUB_REF_NAME#v}.cdx.json"
          (cd "$work" && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only --omit dev \
            --spec-version 1.6 --output-reproducible --validate \
            --output-format JSON --output-file "$work/sbom.cdx.json")
          cp "$work/sbom.cdx.json" "$SBOM_FILE"
          echo "SBOM_FILE=$SBOM_FILE" >> "$GITHUB_ENV"

      - name: Validate SBOM
        env:
          EXPECTED_NAME: '@chronary/sdk'
        run: |
          node - "$SBOM_FILE" "$EXPECTED_NAME" "${GITHUB_REF_NAME#v}" <<'JS'
          const fs = require('fs');
          const [file, expectedName, expectedVersion] = process.argv.slice(2);
          const fail = (msg) => {
            console.error('::error::SBOM ' + file + ': ' + msg);
            process.exit(1);
          };
          let bom;
          try {
            bom = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (e) {
            fail('not readable JSON (' + e.message + ')');
          }
          if (bom.bomFormat !== 'CycloneDX') fail('bomFormat is ' + JSON.stringify(bom.bomFormat) + ', expected CycloneDX');
          if (!/^1\.[4-9]$/.test(String(bom.specVersion))) fail('unsupported specVersion ' + JSON.stringify(bom.specVersion));
          const main = bom.metadata && bom.metadata.component;
          if (!main) fail('metadata.component is missing');
          const name = [main.group, main.name].filter(Boolean).join('/');
          if (name !== expectedName) fail('main component is ' + JSON.stringify(name) + ', expected ' + JSON.stringify(expectedName));
          const bare = (v) => String(v).replace(/^v/, '');
          if (!expectedVersion) fail('no expected version given');
          if (main.version === undefined || main.version === '') main.version = bare(expectedVersion);
          else if (bare(main.version) !== bare(expectedVersion)) fail('version is ' + main.version + ', expected ' + expectedVersion);
          if (bom.components !== undefined && !Array.isArray(bom.components)) fail('components is not an array');
          fs.writeFileSync(file, JSON.stringify(bom, null, 2) + '\n');
          console.log('SBOM ok: ' + name + '@' + main.version + ', ' + (bom.components || []).length + ' components');
          JS

      - name: Attest build provenance for npm tarball
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          # The SBOM too, so a replaced Release asset is detectable.
          subject-path: |
            *.tgz
            sbom/*.cdx.json

      - name: Publish to npm
        if: steps.manifest.outputs.publish_registry == 'true'
        run: npm publish *.tgz --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" *.tgz "$SBOM_FILE" \
            --title "@chronary/sdk ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.txt
