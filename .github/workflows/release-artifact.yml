name: Release Artifact

# Publishes @chronary/sdk to npm and creates a GitHub Release.
#
# Provenance posture:
#   - Publishes via npm OIDC Trusted Publishing — no NPM_TOKEN required.
#     The `id-token: write` permission and `registry-url` on setup-node
#     are sufficient once chronary-node is registered as a Trusted
#     Publisher for @chronary/sdk on npmjs.com.
#   - npm CLI >= 11.5.1 is required for OIDC trusted publishing; we
#     pin npm to latest before publishing because Node 22 ships with
#     npm 10.x by default.
#   - `npm publish --provenance` records a Sigstore attestation that
#     links the published tarball back to this workflow run.
#   - GitHub artifact attestations also fire on public repos via
#     actions/attest-build-provenance.
#
# Prerequisites (one-time, on flip to public):
#   1. chronary-node is public on GitHub.
#   2. npmjs.com → @chronary org → Trusted Publishers → register
#      repo `Chronary/chronary-node`, workflow `release-artifact.yml`,
#      environment blank.
#   3. NPM_TOKEN repo secret has been deleted and the legacy
#      `chronary-node-release` npm access token revoked.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Validate release manifest
        id: manifest
        run: |
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('.chronary-release.json','utf8')); if (manifest.artifact !== 'ts-sdk') throw new Error('Expected artifact ts-sdk'); if (manifest.public_tag !== process.env.GITHUB_REF_NAME) throw new Error('Tag mismatch between manifest and workflow ref'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'publish_registry=' + String(Boolean(manifest.publish_registry)) + '\n');"
          test -f RELEASE_NOTES.txt

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate package contents
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack

      - name: Attest build provenance for npm tarball
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.tgz'

      - name: Publish to npm
        if: steps.manifest.outputs.publish_registry == 'true'
        run: npm publish *.tgz --provenance --access public

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" *.tgz \
            --title "@chronary/sdk ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.txt
